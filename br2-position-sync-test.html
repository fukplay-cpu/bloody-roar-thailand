<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131a">
<title>BR2 Network Movement V4</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:20px 16px;
 background:#10131a;
 color:#f5f7fb;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{max-width:680px;margin:18px auto}
h1{font-size:25px}
p{color:#aeb7c6;line-height:1.55}

input,select{
 width:100%;
 padding:15px;
 border-radius:13px;
 border:1px solid #596170;
 background:#202631;
 color:white;
 font-size:18px;
 margin:7px 0 12px;
}

label{display:block;margin-top:14px}

button{
 border:0;
 border-radius:13px;
 background:#2878f0;
 color:white;
 font-size:20px;
 font-weight:700;
 padding:15px;
 width:100%;
 margin:7px 0;
 touch-action:none;
 user-select:none;
 -webkit-user-select:none;
}

button.secondary{background:#394354}

.row{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.row button{font-size:25px;padding:20px 8px}

.row button.active{
 background:#68d391;
 color:#10131a;
 transform:scale(.95);
}

.panel{
 background:#202631;
 border-radius:17px;
 padding:16px;
 margin-top:16px;
 line-height:1.6;
 overflow-wrap:anywhere;
}

.arena{
 height:280px;
 position:relative;
 border:2px solid #586477;
 border-radius:16px;
 background:
 linear-gradient(#273142 1px,transparent 1px),
 linear-gradient(90deg,#273142 1px,transparent 1px);
 background-size:10% 10%;
 overflow:hidden;
 margin-top:12px;
}

.token{
 position:absolute;
 width:36px;
 height:36px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
 font-size:20px;
 color:#10131a;
 transform:translate(-50%,-50%);
 box-shadow:0 2px 12px #0008;
 z-index:2;
}

.nametag{
 position:absolute;
 transform:translate(-50%,calc(-100% - 25px));
 padding:4px 9px;
 border-radius:8px;
 background:#0b1019;
 color:white;
 font-size:12px;
 font-weight:700;
 white-space:nowrap;
 border:1px solid #596477;
 max-width:130px;
 overflow:hidden;
 text-overflow:ellipsis;
 z-index:3;
 pointer-events:none;
}

#me{background:#68d391}
#other{background:#f6c85f}

.small{font-size:13px;color:#aeb7c6}

#log{
 font:12px ui-monospace,monospace;
 white-space:pre-wrap;
}
</style>
</head>

<body>
<main>

<h1>BR2 Network Movement V4</h1>

<p>
ระบบ Multiplayer พร้อม Smooth Interpolation,
Position Buffer และ Stop Sync
</p>

<label>รหัสห้อง</label>

<input id="code" maxlength="6"
placeholder="เช่น SQ8BD3"
autocapitalize="characters">

<label>เลือกผู้เล่นประจำเครื่องนี้</label>

<select id="player">
<option value="">เชื่อมต่อเพื่อโหลดรายชื่อก่อน</option>
</select>

<button id="connect">เชื่อมต่อห้อง</button>

<button id="disconnect" class="secondary">
ตัดการเชื่อมต่อ
</button>

<section class="panel" id="status">
ยังไม่ได้เชื่อมต่อ
</section>

<section class="panel">

<strong>สนามทดสอบ Multiplayer</strong>

<div class="arena" id="arena">

<div class="nametag" id="meName"
style="left:25%;top:50%">ฉัน</div>

<div class="nametag" id="otherName"
style="left:75%;top:50%">อีกคน</div>

<div class="token" id="me"
style="left:25%;top:50%">▶</div>

<div class="token" id="other"
style="left:75%;top:50%">◀</div>

</div>

<p class="small">
สีเขียว = เครื่องนี้<br>
สีเหลือง = อีกเครื่อง
</p>

</section>

<section class="panel">

<strong>ควบคุมตัวละคร</strong>

<div class="row">

<span></span>
<button data-move="up">↑</button>
<span></span>

<button data-move="left">←</button>
<button data-move="down">↓</button>
<button data-move="right">→</button>

</div>

<p class="small">
กดค้างเพื่อเดินต่อเนื่อง เปลี่ยนทิศทางได้ทันที
</p>

</section>

<section class="panel">

<strong>บันทึกเหตุการณ์</strong>
<div id="log">พร้อมทดสอบ</div>

</section>

<script>

const BASE="wss://br2-online-rooms.fukthefuk400.workers.dev";

const $=id=>document.getElementById(id);

let ws=null;
let room=null;
let myId="";

let positions={};
let remote={};
let directions={};

let activeDirection=null;

let lastSend=0;
let lastFrame=0;

const SPEED=32;
const SEND_RATE=50;

// เวลาหน่วงของ Buffer เพื่อช่วยให้ตำแหน่งต่อเนื่อง
const INTERPOLATION_DELAY=100;

// จำนวนตำแหน่งสูงสุดที่เก็บต่อผู้เล่น
const MAX_SNAPSHOTS=30;

function log(s){

 $("log").textContent=
 `[${new Date().toLocaleTimeString("th-TH")}] ${s}\n`+
 $("log").textContent;

}

function clamp(v,min,max){

 return Math.max(min,Math.min(max,v));

}

function getPosition(id){

 return positions[id]||{x:25,y:50};

}

function sendPosition(){

 if(!ws||ws.readyState!==WebSocket.OPEN||!myId)return;

 const p=getPosition(myId);

 ws.send(JSON.stringify({

  type:"position",
  playerId:myId,
  x:p.x,
  y:p.y,
  direction:directions[myId]||"stop"

 }));

 lastSend=performance.now();

}

// รับตำแหน่งจริงจากอีกเครื่องและเก็บลง Buffer

function receivePosition(d){

 if(d.playerId===myId)return;

 const id=d.playerId;

 const x=Number(d.x);
 const y=Number(d.y);

 if(!Number.isFinite(x)||!Number.isFinite(y))return;

 const now=performance.now();

 const next={
  x:clamp(x,3,97),
  y:clamp(y,7,93),
  time:now
 };

 const dir=[
  "left","right","up","down","stop"
 ].includes(d.direction)?d.direction:null;

 if(!remote[id]){
  remote[id]=[];
 }

 const buffer=remote[id];

 // ป้องกันข้อมูลเก่ากว่าตำแหน่งล่าสุด
 if(buffer.length){

  const last=buffer[buffer.length-1];

  if(now<=last.time)return;

 }

 buffer.push(next);

 // จำกัดขนาด Buffer
 while(buffer.length>MAX_SNAPSHOTS){
  buffer.shift();
 }

 if(dir!==null){
  directions[id]=dir;
 }

}

// คำนวณตำแหน่งระหว่างข้อมูลสองจุด

function interpolatePosition(id,renderTime){

 const buffer=remote[id];

 if(!buffer||buffer.length===0)return null;

 // ลบข้อมูลที่เก่ากว่าเวลาที่ต้องแสดง
 while(
  buffer.length>2&&
  buffer[1].time<renderTime
 ){
  buffer.shift();
 }

 // หากมีข้อมูลเพียงจุดเดียว ให้ใช้จุดนั้น
 if(buffer.length===1){

  return {
   x:buffer[0].x,
   y:buffer[0].y
  };

 }

 // หาจุดสองจุดที่คร่อมเวลาแสดงผล
 for(let i=0;i<buffer.length-1;i++){

  const a=buffer[i];
  const b=buffer[i+1];

  if(renderTime>=a.time&&renderTime<=b.time){

   const duration=b.time-a.time;

   if(duration<=0){

    return {x:b.x,y:b.y};

   }

   const t=clamp(
    (renderTime-a.time)/duration,
    0,
    1
   );

   return {

    x:a.x+(b.x-a.x)*t,

    y:a.y+(b.y-a.y)*t

   };

  }

 }

 // เวลายังเก่ากว่าข้อมูลแรก
 if(renderTime<buffer[0].time){

  return {
   x:buffer[0].x,
   y:buffer[0].y
  };

 }

 // ไม่มีข้อมูลอนาคตมารองรับ
 // ใช้ตำแหน่งล่าสุดโดยไม่คาดการณ์ต่อ
 const last=buffer[buffer.length-1];

 return {
  x:last.x,
  y:last.y
 };

}

function renderPlayer(id,element){

 const p=positions[id]||{x:25,y:50};

 element.style.left=p.x+"%";
 element.style.top=p.y+"%";

}

function draw(){

 if(!room)return;

 const players=room.players||[];

 const minePlayer=players.find(p=>p.id===myId);

 const others=players.filter(p=>p.id!==myId);

 const otherPlayer=others[0];

 const mine=getPosition(myId);

 renderPlayer(myId,$("me"));

 $("meName").textContent=
 minePlayer?.name||"ผู้เล่นของฉัน";

 $("meName").style.left=mine.x+"%";
 $("meName").style.top=mine.y+"%";

 if(otherPlayer){

  const other=positions[otherPlayer.id]||
  {x:75,y:50};

  renderPlayer(otherPlayer.id,$("other"));

  $("otherName").textContent=otherPlayer.name;

  $("otherName").style.left=other.x+"%";
  $("otherName").style.top=other.y+"%";

  $("other").textContent=
  directions[otherPlayer.id]==="left"?"◀":
  directions[otherPlayer.id]==="right"?"▶":
  directions[otherPlayer.id]==="up"?"↑":
  directions[otherPlayer.id]==="down"?"↓":"◀";

 }else{

  $("otherName").textContent="รอผู้เล่นอีกคน";

 }

 $("me").textContent=
 directions[myId]==="left"?"◀":
 directions[myId]==="right"?"▶":
 directions[myId]==="up"?"↑":
 directions[myId]==="down"?"↓":"▶";

}

function updateRoom(r){

 room=r;

 const select=$("player");
 const old=select.value;

 select.innerHTML=
 '<option value="">เลือกผู้เล่น</option>'+
 (r.players||[]).map(p=>
 `<option value="${p.id}">${p.name}</option>`
 ).join("");

 if(old&&(r.players||[]).some(p=>p.id===old)){
  select.value=old;
 }

 $("status").textContent=
 `ห้อง ${r.code||$("code").value} · ${r.status} · ${(r.players||[]).length}/2 คน`;

 draw();

}

$("connect").onclick=()=>{

 const code=$("code").value.trim().toUpperCase();

 if(!/^[A-Z0-9]{6}$/.test(code)){
  alert("กรุณาใส่รหัสห้อง 6 ตัว");
  return;
 }

 stopMove();

 if(ws)ws.close();

 remote={};
 positions={};
 directions={};
 room=null;
 myId="";

 $("player").innerHTML=
 '<option value="">เชื่อมต่อเพื่อโหลดรายชื่อก่อน</option>';

 $("code").value=code;
 $("log").textContent="";
 $("status").textContent="กำลังเชื่อมต่อ...";

 ws=new WebSocket(`${BASE}/room/${code}/ws`);

 ws.onopen=()=>{
  log("WebSocket connected");
 };

 ws.onmessage=e=>{

  try{

   const d=JSON.parse(e.data);

   if(d.type==="state"&&d.room){

    updateRoom(d.room);
    log("รับข้อมูลห้องแล้ว");

   }

   else if(d.type==="position"){

    receivePosition(d);

   }

   else if(d.type==="error"){

    log("Server: "+d.message);

   }

  }catch(err){

   log("อ่านข้อมูลไม่ได้: "+err.message);

  }

 };

 ws.onclose=e=>{

  stopMove();

  $("status").textContent=
  `การเชื่อมต่อปิดแล้ว (${e.code})`;

  log("WebSocket closed "+e.code);

 };

 ws.onerror=()=>{
  log("WebSocket error");
 };

};

$("player").onchange=()=>{

 myId=$("player").value;

 if(myId&&!positions[myId]){
  positions[myId]={x:25,y:50};
 }

 draw();

 if(myId)log("เลือกผู้เล่น "+myId.slice(0,6));

};

function startMove(dir){

 if(!ws||ws.readyState!==WebSocket.OPEN){
  log("ยังไม่ได้เชื่อมต่อ");
  return;
 }

 if(!myId){
  log("กรุณาเลือกผู้เล่นประจำเครื่อง");
  return;
 }

 if(activeDirection===dir)return;

 activeDirection=dir;

 directions[myId]=dir;

 document.querySelectorAll("[data-move]").forEach(b=>{
  b.classList.toggle("active",b.dataset.move===dir);
 });

 // ส่งทิศทางใหม่ทันที
 sendPosition();

}

function stopMove(){

 const wasMoving=activeDirection!==null;

 activeDirection=null;

 document.querySelectorAll("[data-move]").forEach(b=>{
  b.classList.remove("active");
 });

 if(wasMoving&&myId){

  directions[myId]="stop";

  // ส่งตำแหน่งหยุดทันที
  sendPosition();

 }

}

function movementLoop(time){

 requestAnimationFrame(movementLoop);

 const dt=lastFrame?
 Math.min((time-lastFrame)/1000,0.05):0;

 lastFrame=time;

 if(!room)return;

 // LOCAL MOVEMENT

 if(activeDirection&&myId&&ws&&ws.readyState===WebSocket.OPEN){

  const p=getPosition(myId);

  const amount=SPEED*dt;

  if(activeDirection==="left")p.x-=amount;
  if(activeDirection==="right")p.x+=amount;
  if(activeDirection==="up")p.y-=amount;
  if(activeDirection==="down")p.y+=amount;

  p.x=clamp(p.x,3,97);
  p.y=clamp(p.y,7,93);

  positions[myId]=p;

  if(time-lastSend>=SEND_RATE){
   sendPosition();
  }

 }

 // REMOTE INTERPOLATION

 const renderTime=performance.now()-INTERPOLATION_DELAY;

 Object.keys(remote).forEach(id=>{

  const p=interpolatePosition(id,renderTime);

  if(p){

   positions[id]={
    x:clamp(p.x,3,97),
    y:clamp(p.y,7,93)
   };

  }

 });

 draw();

}

requestAnimationFrame(movementLoop);

// TOUCH CONTROLS

document.querySelectorAll("[data-move]").forEach(b=>{

 b.addEventListener("pointerdown",e=>{

  e.preventDefault();

  try{
   b.setPointerCapture(e.pointerId);
  }catch(err){}

  startMove(b.dataset.move);

 });

 b.addEventListener("pointerup",e=>{

  e.preventDefault();

  stopMove();

 });

 b.addEventListener("pointercancel",stopMove);

 b.addEventListener("lostpointercapture",stopMove);

});

document.addEventListener("visibilitychange",()=>{

 if(document.hidden)stopMove();

});

$("disconnect").onclick=()=>{

 stopMove();

 if(ws)ws.close(1000,"disconnect");

 ws=null;

 $("status").textContent="ตัดการเชื่อมต่อแล้ว";

};

</script>

</main>
</body>
</html>
