<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131a">
<title>BR2 Position Sync Test</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 16px;background:#10131a;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:680px;margin:18px auto}h1{font-size:27px;line-height:1.3}p{color:#aeb7c6;line-height:1.55}
input,select{width:100%;padding:15px;border-radius:13px;border:1px solid #596170;background:#202631;color:white;font-size:18px;margin:7px 0 12px}
label{display:block;margin-top:14px}button{border:0;border-radius:13px;background:#2878f0;color:white;font-size:17px;font-weight:700;padding:15px;width:100%;margin:7px 0;touch-action:manipulation}
button.secondary{background:#394354}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row button{font-size:24px;padding:18px 8px}
.panel{background:#202631;border-radius:17px;padding:16px;margin-top:16px;line-height:1.6;overflow-wrap:anywhere}
.arena{height:260px;position:relative;border:2px solid #586477;border-radius:16px;background:linear-gradient(#273142 1px,transparent 1px),linear-gradient(90deg,#273142 1px,transparent 1px);background-size:10% 10%;overflow:hidden;margin-top:12px}
.token{position:absolute;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#10131a;transform:translate(-50%,-50%);box-shadow:0 2px 12px #0008}
#me{background:#68d391}#other{background:#f6c85f}
.small{font-size:13px;color:#aeb7c6}#log{font:12px ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body><main>
<h1>ทดสอบซิงก์ตำแหน่งผู้เล่น</h1>
<p>หน้านี้เป็นสนามทดสอบแยกจากตัวเกม ใช้ตรวจว่าการขยับผู้เล่นบนเครื่องหนึ่งส่งตำแหน่งไปอีกเครื่องแบบเรียลไทม์ได้หรือไม่</p>
<label>รหัสห้อง</label><input id="code" maxlength="6" placeholder="เช่น SQ8BD3" autocapitalize="characters">
<label>เลือกผู้เล่นประจำเครื่องนี้</label><select id="player"><option value="">เชื่อมต่อเพื่อโหลดรายชื่อก่อน</option></select>
<button id="connect">เชื่อมต่อห้อง</button><button id="disconnect" class="secondary">ตัดการเชื่อมต่อ</button>
<section class="panel" id="status">ยังไม่ได้เชื่อมต่อ</section>
<section class="panel">
<strong>สนามทดสอบ</strong><div class="arena" id="arena"><div class="token" id="me" style="left:25%;top:50%">ฉัน</div><div class="token" id="other" style="left:75%;top:50%">อีกคน</div></div>
<p class="small">วงกลมสีเขียวคือผู้เล่นเครื่องนี้ วงกลมสีเหลืองคือผู้เล่นอีกเครื่อง</p>
</section>
<section class="panel">
<strong>ควบคุมตำแหน่ง</strong>
<div class="row"><span></span><button data-move="up">↑</button><span></span><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div>
</section>
<section class="panel"><strong>บันทึกเหตุการณ์</strong><div id="log">พร้อมทดสอบ</div></section>
<script>
const BASE="wss://br2-online-rooms.fukthefuk400.workers.dev";
const $=id=>document.getElementById(id);
let ws=null,room=null,myId="",positions={};
function log(s){$("log").textContent=`[${new Date().toLocaleTimeString("th-TH")}] ${s}\n`+$("log").textContent;}
function draw(){
 if(!room)return;
 const others=(room.players||[]).filter(p=>p.id!==myId);
 const mine=positions[myId]||{x:25,y:50};
 const other=others.length?(positions[others[0].id]||{x:75,y:50}):{x:75,y:50};
 $("me").style.left=mine.x+"%";$("me").style.top=mine.y+"%";
 $("other").style.left=other.x+"%";$("other").style.top=other.y+"%";
}
function updateRoom(r){
 room=r;
 const select=$("player"),old=select.value;
 select.innerHTML='<option value="">เลือกผู้เล่น</option>'+(r.players||[]).map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
 if(old&&(r.players||[]).some(p=>p.id===old))select.value=old;
 $("status").textContent=`ห้อง ${r.code||$("code").value} · ${r.status} · ${(r.players||[]).length}/2 คน`;
 draw();
}
$("connect").onclick=()=>{
 const code=$("code").value.trim().toUpperCase();
 if(!/^[A-Z0-9]{6}$/.test(code)){alert("กรุณาใส่รหัสห้อง 6 ตัว");return;}
 if(ws)ws.close();
 $("code").value=code;$("log").textContent="";$("status").textContent="กำลังเชื่อมต่อ...";
 ws=new WebSocket(`${BASE}/room/${code}/ws`);
 ws.onopen=()=>log("WebSocket connected");
 ws.onmessage=e=>{
  try{const d=JSON.parse(e.data);
   if(d.type==="state"&&d.room){updateRoom(d.room);log("รับข้อมูลห้องแล้ว");}
   else if(d.type==="position"){positions[d.playerId]={x:d.x,y:d.y};draw();log(`รับตำแหน่ง ${d.playerId.slice(0,6)}: ${d.x}, ${d.y}`);}
   else if(d.type==="error")log("Server: "+d.message);
  }catch(err){log("อ่านข้อมูลไม่ได้: "+err.message);}
 };
 ws.onclose=e=>{$("status").textContent=`การเชื่อมต่อปิดแล้ว (${e.code})`;log("WebSocket closed "+e.code);};
 ws.onerror=()=>log("WebSocket error");
};
$("player").onchange=()=>{myId=$("player").value;draw();if(myId)log("เลือกผู้เล่น "+myId.slice(0,6));};
function move(dir){
 if(!ws||ws.readyState!==WebSocket.OPEN){log("ยังไม่ได้เชื่อมต่อ");return;}
 if(!myId){log("กรุณาเลือกผู้เล่นของเครื่องนี้ก่อน");return;}
 const p=positions[myId]||{x:25,y:50},step=4;
 if(dir==="left")p.x-=step;if(dir==="right")p.x+=step;if(dir==="up")p.y-=step;if(dir==="down")p.y+=step;
 p.x=Math.max(3,Math.min(97,p.x));p.y=Math.max(7,Math.min(93,p.y));
 positions[myId]=p;draw();
 ws.send(JSON.stringify({type:"position",playerId:myId,x:p.x,y:p.y,direction:dir==="left"?"left":"right"}));
}
document.querySelectorAll("[data-move]").forEach(b=>{
 b.addEventListener("click",()=>move(b.dataset.move));
 b.addEventListener("touchstart",e=>{e.preventDefault();move(b.dataset.move);},{passive:false});
});
$("disconnect").onclick=()=>{if(ws)ws.close(1000,"disconnect");ws=null;$("status").textContent="ตัดการเชื่อมต่อแล้ว";};
</script></main></body></html>
