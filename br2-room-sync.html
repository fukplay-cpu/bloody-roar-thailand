<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131a">
<title>BR2 Room Sync</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 18px;background:#10131a;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:640px;margin:24px auto}h1{font-size:28px;line-height:1.35}p{color:#aeb7c6;line-height:1.6}
label{display:block;margin:22px 0 8px}input{width:100%;padding:16px;border-radius:14px;border:1px solid #596170;background:#202631;color:white;font-size:18px}
button{padding:15px 18px;border:0;border-radius:14px;background:#2878f0;color:white;font-size:17px;font-weight:700;margin-top:14px;width:100%}
.panel{background:#202631;border-radius:18px;padding:18px;margin-top:20px;line-height:1.7;overflow-wrap:anywhere}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:#344052}
ul{padding-left:24px}.muted{color:#9ba6b7;font-size:14px}
</style>
</head>
<body><main>
<h1>ติดตามสถานะห้องออนไลน์ Bloody Roar 2</h1>
<p>เปิดหน้านี้บนทั้งสองเครื่อง แล้วใส่รหัสห้องเดียวกัน ระบบจะตรวจสอบสถานะห้องซ้ำทุก 1.5 วินาทีโดยอัตโนมัติ</p>
<label for="code">รหัสห้อง</label>
<input id="code" maxlength="6" placeholder="เช่น SQ8BD3" autocapitalize="characters" autocomplete="off">
<button id="start">เริ่มติดตามห้อง</button>
<section class="panel" id="result">ยังไม่ได้เริ่มติดตาม</section>
<p class="muted" id="updated">ยังไม่มีข้อมูล</p>
<script>
const API="https://br2-online-rooms.fukthefuk400.workers.dev";
const $=id=>document.getElementById(id);
let timer=null, busy=false;
async function refresh(){
  if(busy)return; busy=true;
  const code=$("code").value.trim().toUpperCase();
  try{
    const response=await fetch(`${API}/room/${code}/state`,{cache:"no-store"});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);
    const players=Array.isArray(data.players)?data.players:[];
    $("result").innerHTML=
      `<div>รหัสห้อง: <strong>${escapeHtml(data.code||code)}</strong></div>`+
      `<div>สถานะ: <span class="pill">${escapeHtml(data.status||"unknown")}</span></div>`+
      `<div>จำนวนผู้เล่น: <strong>${players.length}/2</strong></div>`+
      `<ul>${players.map(p=>`<li>${escapeHtml(p.name||"ผู้เล่น")}</li>`).join("")}</ul>`;
    $("updated").textContent="อัปเดตล่าสุด: "+new Date().toLocaleTimeString("th-TH");
  }catch(e){
    $("result").textContent="อ่านสถานะห้องไม่สำเร็จ: "+e.message;
    $("updated").textContent="จะลองใหม่อัตโนมัติ";
  }finally{busy=false;}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("start").addEventListener("click",()=>{
  const code=$("code").value.trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(code)){$("result").textContent="กรุณากรอกรหัสห้อง 6 ตัว";return;}
  $("code").value=code;
  if(timer)clearInterval(timer);
  $("start").textContent="กำลังติดตามห้อง...";
  refresh();
  timer=setInterval(refresh,1500);
});
</script>
</main></body></html>
